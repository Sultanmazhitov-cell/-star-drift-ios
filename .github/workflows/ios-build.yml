name: Build iOS simulator app

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate Xcode project
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show selected Xcode version
        run: xcodebuild -version

      - name: Build without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project StarDrift.xcodeproj \
            -scheme StarDrift \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release-iphonesimulator/StarDrift.app \
            StarDrift-Simulator.zip

      - name: Save simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarDrift-Simulator
          path: StarDrift-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > build/simulators.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          devices = json.loads(Path('build/simulators.json').read_text())['devices']
          choices = []
          for runtime, values in devices.items():
              if '.iOS-' not in runtime:
                  continue
              version = tuple(map(int, re.findall(r'\d+', runtime.rsplit('.iOS-', 1)[1])))
              for device in values:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      choices.append((version, 'Pro Max' in device['name'], device['name'], device['udid']))
          if not choices:
              raise SystemExit('No available iPhone simulator runtime is installed.')
          _, _, name, identifier = max(choices)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SIMULATOR_ID=' + identifier + '\n')
          print('Selected simulator:', name)
          PY

      - name: Test native screens and capture screenshots
        run: |
          set -euo pipefail
          xcodebuild \
            -project StarDrift.xcodeproj \
            -scheme StarDrift \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-tests \
            -resultBundlePath build/UITests.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test | tee build/uitests.log

      - name: Export test screenshots
        if: always()
        run: |
          set -euo pipefail
          if [[ -d build/UITests.xcresult ]]; then
            xcrun xcresulttool export attachments \
              --path build/UITests.xcresult \
              --output-path build/screenshots
          fi

      - name: Save native test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StarDrift-UI-Results
          path: |
            build/UITests.xcresult
            build/screenshots
            build/uitests.log
          if-no-files-found: warn
          retention-days: 14
