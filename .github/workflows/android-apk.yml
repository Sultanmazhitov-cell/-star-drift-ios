name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and check installable APK
        working-directory: android
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          gradle --no-daemon :app:assembleDebug :app:lintDebug
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk StarDrift-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarDrift-Android-APK
          path: android/StarDrift-Android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the offline game on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: android
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Save Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StarDrift-Android-Test-Results
          path: android/app/build/reports
          if-no-files-found: warn
