name: Upload to TestFlight

# Runs only when the owner explicitly starts it. Requires authorized Apple
# Developer signing assets and an existing app record in App Store Connect.
# Uploads a build; does not submit the app to App Review or release it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check release configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_APP_STORE_PROFILE_BASE64 APPLE_TEAM_ID APP_BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing GitHub Actions secret: $variable"
              exit 1
            fi
          done
          if [[ "$APP_BUNDLE_ID" == "com.example.StarDrift" ]]; then
            echo '::error::Register a unique App ID and use its Bundle ID.'
            exit 1
          fi
          xcodebuild -version

      - name: Install signing assets in a temporary keychain
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/star-drift-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          export SIGNING_DIR
          security list-keychains -d user > "$SIGNING_DIR/original-keychains.txt"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          folder = Path(os.environ['SIGNING_DIR'])
          for secret, filename in [
              ('IOS_DISTRIBUTION_P12_BASE64', 'distribution.p12'),
              ('IOS_APP_STORE_PROFILE_BASE64', 'profile.mobileprovision'),
          ]:
              encoded = ''.join(os.environ[secret].split())
              path = folder / filename
              path.write_bytes(base64.b64decode(encoded, validate=True))
              path.chmod(0o600)
          PY
          KEYCHAIN_PATH="$SIGNING_DIR/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGNING_DIR/distribution.p12" \
            -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$SIGNING_DIR/profile.mobileprovision" > "$SIGNING_DIR/profile.plist"
          python3 - <<'PY'
          import datetime, os, plistlib, uuid
          from pathlib import Path
          folder = Path(os.environ['SIGNING_DIR'])
          profile = plistlib.loads((folder / 'profile.plist').read_bytes())
          team = os.environ['APPLE_TEAM_ID']
          bundle = os.environ['APP_BUNDLE_ID']
          entitlements = profile['Entitlements']
          if team not in profile.get('TeamIdentifier', []):
              raise SystemExit('Provisioning profile does not belong to APPLE_TEAM_ID.')
          app_id = entitlements.get('application-identifier', '')
          prefixes = profile.get('ApplicationIdentifierPrefix', [])
          if not any(app_id == prefix + '.' + bundle for prefix in prefixes):
              raise SystemExit('Provisioning profile does not match APP_BUNDLE_ID.')
          if entitlements.get('get-task-allow') or profile.get('ProvisionedDevices') or profile.get('ProvisionsAllDevices'):
              raise SystemExit('Use an App Store Connect distribution provisioning profile.')
          if profile['ExpirationDate'].replace(tzinfo=datetime.timezone.utc) <= datetime.datetime.now(datetime.timezone.utc):
              raise SystemExit('Provisioning profile has expired.')
          profile_uuid = str(uuid.UUID(profile['UUID'])).upper()
          installed = Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles' / (profile_uuid + '.mobileprovision')
          legacy_installed = Path.home() / 'Library/MobileDevice/Provisioning Profiles' / (profile_uuid + '.mobileprovision')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PROFILE_UUID=' + profile_uuid + '\n')
              output.write('INSTALLED_PROFILE_PATH=' + str(installed) + '\n')
              output.write('LEGACY_INSTALLED_PROFILE_PATH=' + str(legacy_installed) + '\n')
          for destination in [installed, legacy_installed]:
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes((folder / 'profile.mobileprovision').read_bytes())
              destination.chmod(0o600)
          options = {
              'method': 'app-store-connect',
              'destination': 'export',
              'teamID': team,
              'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution',
              'provisioningProfiles': {bundle: profile_uuid},
              'manageAppVersionAndBuildNumber': False,
              'uploadSymbols': True,
          }
          (folder / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY

      - name: Archive signed iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project StarDrift.xcodeproj \
            -scheme StarDrift \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StarDrift.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/star-drift-derived-data" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Export App Store package
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StarDrift.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/star-drift-signing/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/star-drift-export"

      - name: Upload build to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/star-drift-signing/api-keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          chmod 700 "$API_PRIVATE_KEYS_DIR"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          key_id = os.environ['ASC_KEY_ID']
          if not re.fullmatch(r'[A-Za-z0-9]+', key_id):
              raise SystemExit('Invalid ASC_KEY_ID format.')
          path = Path(os.environ['API_PRIVATE_KEYS_DIR']) / ('AuthKey_' + key_id + '.p8')
          path.write_text(os.environ['ASC_PRIVATE_KEY'].strip() + '\n')
          path.chmod(0o600)
          PY
          PACKAGE="$RUNNER_TEMP/star-drift-export/StarDrift.ipa"
          test -f "$PACKAGE"
          xcrun altool --upload-app --type ios --file "$PACKAGE" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove signing assets and build files
        if: always()
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import os, shlex, subprocess
          from pathlib import Path
          original = Path(os.environ['RUNNER_TEMP']) / 'star-drift-signing/original-keychains.txt'
          if original.exists():
              paths = shlex.split(original.read_text())
              if paths:
                  subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *paths], check=False)
          PY
          security delete-keychain "$RUNNER_TEMP/star-drift-signing/signing.keychain-db" 2>/dev/null
          if [[ -n "${INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "$INSTALLED_PROFILE_PATH"
          fi
          if [[ -n "${LEGACY_INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "$LEGACY_INSTALLED_PROFILE_PATH"
          fi
          rm -rf "$RUNNER_TEMP/star-drift-signing" "$RUNNER_TEMP/StarDrift.xcarchive" \
            "$RUNNER_TEMP/star-drift-derived-data" "$RUNNER_TEMP/star-drift-export"
